<script type="text/plain" id="dc-logic" data-props='{"startScreen":{"editor":"enum","options":["Home","Proforma Invoice","PI Detail","Complete PI (pre-filled)","Add PI","Add PI · products added","Add PI · product pop-up","Edit PI"],"default":"Home","section":"Preview"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var self = this;

    this.show = function (screen) {
      self.setState(self.stateFor(screen));
      try { window.scrollTo(0, 0); } catch (e) {}
    };
    this.state = this.stateFor(props.startScreen || 'Home');

    this.goHome = function () { self.show('Home'); };
    this.goList = function () { self.show('Proforma Invoice'); };
    this.goAdd = function () { self.show('Add PI'); };
    this.goDetail = function () { self.show('PI Detail'); };
    this.goEdit = function () { self.show('Edit PI'); };
    this.formBack = function () { self.show(self.state.mode === 'edit' ? 'PI Detail' : 'Proforma Invoice'); };
    this.onSubmit = function () { self.show(self.state.mode === 'edit' ? 'PI Detail' : 'Proforma Invoice'); };
    this.onNav = function (id) {
      if (id === 'dashboard') self.show('Home');
      if (id === 'nav-pi') self.show('Proforma Invoice');
    };
    this.onOpenModule = function (m) { if (m && m.id === 'pi') self.show('Proforma Invoice'); };
    this.onSearch = function (q) { self.setState({ q: q || '' }); };
    this.onSearchSelect = function (item) {
      if (!item) return;
      if (item.id === 'pi') self.show('Proforma Invoice');
      if (item.id.indexOf('pi-') === 0) self.show('PI Detail');
      if (item.id === 'add-pi') self.show('Add PI');
    };
